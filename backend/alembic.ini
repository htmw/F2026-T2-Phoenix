[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Timestamped, ordered revision filenames so history reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# The URL is supplied from application settings in migrations/env.py; it is not
# duplicated here, so there is no second place for credentials to live.
sqlalchemy.url =

# No post-write hook: ruff is a compiled binary rather than a Python entry point, so
# Alembic's hook mechanisms are unreliable here. Generated migrations are formatted by
# `make format` and enforced by the CI format check like any other file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
